name: CodeQL (SAST)

# NOTE: this file is a template — copy it into the target repo and restore
# the push/pull_request/schedule triggers below. Left as workflow_dispatch-only
# here because devsecops-template itself has no JS/Python source for CodeQL
# to analyze (it's just YAML/Markdown config), which would otherwise fail
# every run with "no source code seen during build".
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   # Weekly scan even if nobody pushes, so newly-disclosed CVEs
  #   # against unchanged code still get caught.
  #   - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL auto-detects most languages. Trim this list to what
        # the repo actually contains — extra languages just slow CI.
        language: ["javascript-typescript", "python"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

name: Workspace rebuild
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '16 4 * * *'
permissions:
  contents: read
concurrency:
  group: workspace-rebuild-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    name: YAML and documentation structure only; application build not applicable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate template configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.github').rglob('*.yml')) + [Path('.pre-commit-config.yaml')]
          assert paths
          for path in paths:
              value = yaml.safe_load(path.read_text())
              assert isinstance(value, dict), str(path)
              if path.parent.name == 'workflows':
                  assert 'jobs' in value and ('on' in value or True in value), str(path)
          for name in ('README.md', 'SECURITY.md', '.github/CODEOWNERS'):
              assert Path(name).stat().st_size > 0
          print('Template structure valid; placeholders preserved; application build not applicable')
          PY
      - name: Record execution evidence
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          VALIDATION_SCOPE: 'YAML and documentation structure only; application build not applicable'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = dict(schema=1, repository=os.environ['GITHUB_REPOSITORY'],
                        commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        status=os.environ['BUILD_STATUS'], scope=os.environ['VALIDATION_SCOPE'])
          Path('workspace-rebuild.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Workspace rebuild: ' + report['status'] + '\n\n' + report['scope'] + '\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: workspace-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace-rebuild.json
          if-no-files-found: error
          retention-days: 30
